name: cognivault-automatic-recall
version: 0.1.0
description: "Read-only evidence before answers, through Hermes native MCP and a separate Core Python."
kind: standalone
requires_hermes: ">=0.22.5,<0.23"
provides_hooks:
  - pre_llm_call
config_schema:
  python_executable:
    type: str
    required: true
    description: "Absolute path to the separate CogniVault Python; do not install CogniVault into Hermes."
  core_source_root:
    type: str
    required: true
    description: "Absolute path to the directory containing cognivault (usually repository src)."
  gateway_server:
    type: str
    required: true
    description: "Existing native MCP server, granted separately by mcp_allowlist."
  allowed_domains:
    type: list
    required: true
    description: "Nonempty unique selection from memory, history and study; enforced by plugin."
  context_delivery_acknowledged:
    type: bool
    required: true
    description: "Must be true: evidence enters the configured model and Host logs; external model services may receive it."
