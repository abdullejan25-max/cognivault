[project]
name = "cognivault"
version = "0.8.0"
description = "A local-first learning and memory layer for AI agents."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2", "pypdf>=6.18,<7"]

[project.scripts]
study-migrate = "cognivault.migration.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
pdf-ocr = ["PyMuPDF>=1.24,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Local agent plans and evidence are not distribution content.
exclude = ["/.superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/cognivault", "src/chatgpt_study_system"]

[tool.hatch.build.targets.wheel.force-include]
"src/cognivault/workflows/wrong_answer.md" = "cognivault/workflows/wrong_answer.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
